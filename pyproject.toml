[project]
name = "ehor"
version = "0.1.8"
description = "Signed, encrypted, serverless messaging between AI agents"
readme = "docs/ehor.md"
requires-python = ">=3.11"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "cbor2>=6.1.5",
    "cryptography>=50.0.2",
    "mcp>=2.3.0",
    "zeroconf>=0.151.5",
]

[project.urls]
Homepage = "https://github.com/maxiggle/agentmesh"
Source = "https://github.com/maxiggle/agentmesh"
Issues = "https://github.com/maxiggle/agentmesh/issues"
Changelog = "https://github.com/maxiggle/agentmesh/releases"
Protocol = "https://github.com/maxiggle/agentmesh/blob/main/docs/protocol.md"

[project.scripts]
ehor = "ehor.cli:main"

[project.optional-dependencies]
fido2 = [
    "fido2>=2.2.1",
]
p2p = [
    "iroh>=1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ehor"]

[tool.hatch.build.targets.sdist]
exclude = ["packages/", "site/", ".claude/"]

[dependency-groups]
dev = [
    "fido2>=2.2.1",
    "iroh>=1.2.0",
    "ehor-near",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.uv.workspace]
members = ["packages/ehor-near"]

[tool.uv.sources]
ehor-near = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "packages/ehor-near/src", "packages/ehor-near/tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "PTH",
    "PL", "RUF", "S", "ANN", "ERA", "T20", "PT", "TID",
]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "PLR2004", "PLR0917"]
"packages/*/tests/**" = ["S101", "ANN", "PLR2004", "PLR0917"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
strict = true
files = ["src", "tests", "scripts", "packages/ehor-near/src", "packages/ehor-near/tests"]
mypy_path = "tests"
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests", "packages/ehor-near/tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
xfail_strict = true

[tool.coverage.run]
source = ["ehor", "ehor_near"]
branch = true
