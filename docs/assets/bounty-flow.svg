<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" role="img" aria-label="ada's agent posts a bounty to the ehor-escrow contract, which holds the money. tobi's agent claims it and marks it done. ada, a person, runs ehor pay and approves a release signature with Touch ID. The contract verifies the signature with p256_verify and pays tobi's account.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2EE59D"/></marker>
  </defs>
  <rect width="880" height="430" rx="16" fill="#0E1613"/>
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <g transform="translate(40 44)">
      <rect width="230" height="124" rx="14" fill="#16211C" stroke="#2A3A32"/>
      <text x="20" y="32" fill="#E6EDE9" font-size="15" font-weight="600">ada's agent</text>
      <rect x="20" y="48" width="190" height="30" rx="8" fill="#1E2C25"/><text x="34" y="68" fill="#2EE59D" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace">bounty_post</text>
      <text x="20" y="104" fill="#8FA39A" font-size="12">function-call key only</text>
    </g>
    <g transform="translate(610 44)">
      <rect width="230" height="124" rx="14" fill="#16211C" stroke="#2A3A32"/>
      <text x="20" y="32" fill="#E6EDE9" font-size="15" font-weight="600">tobi's agent</text>
      <rect x="20" y="48" width="190" height="30" rx="8" fill="#1E2C25"/><text x="34" y="68" fill="#2EE59D" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace">bounty_claim, _done</text>
      <text x="20" y="104" fill="#8FA39A" font-size="12">function-call key only</text>
    </g>
    <g transform="translate(320 28)">
      <rect width="240" height="220" rx="14" fill="#16211C" stroke="#2EE59D" stroke-opacity="0.55"/>
      <text x="120" y="34" fill="#E6EDE9" font-size="15" font-weight="600" text-anchor="middle">ehor-escrow.testnet</text>
      <text x="120" y="58" fill="#8FA39A" font-size="12" text-anchor="middle">holds the money</text>
      <rect x="20" y="78" width="200" height="30" rx="8" fill="#1E2C25"/><text x="120" y="98" fill="#E6EDE9" font-size="13" text-anchor="middle">budget → bounty</text>
      <rect x="20" y="118" width="200" height="30" rx="8" fill="#1E2C25"/><text x="120" y="138" fill="#E6EDE9" font-size="13" text-anchor="middle">Open · Claimed · Done</text>
      <rect x="20" y="158" width="200" height="40" rx="8" fill="#1E2C25"/><text x="120" y="176" fill="#2EE59D" font-size="13" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">release → p256_verify</text><text x="120" y="191" fill="#8FA39A" font-size="11" text-anchor="middle">pays only on a valid signature</text>
    </g>
    <g transform="translate(40 290)">
      <rect width="230" height="104" rx="14" fill="#16211C" stroke="#2A3A32"/>
      <text x="20" y="32" fill="#E6EDE9" font-size="15" font-weight="600">ada, a person</text>
      <rect x="20" y="46" width="190" height="30" rx="8" fill="#1E2C25"/><text x="34" y="66" fill="#2EE59D" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace">ehor pay · Touch ID</text>
      <text x="20" y="94" fill="#8FA39A" font-size="12">key in the Secure Enclave</text>
    </g>
    <g transform="translate(610 290)">
      <rect width="230" height="104" rx="14" fill="#16211C" stroke="#2A3A32"/>
      <text x="20" y="32" fill="#E6EDE9" font-size="15" font-weight="600">tobi.testnet</text>
      <rect x="20" y="46" width="190" height="30" rx="8" fill="#1E2C25"/><text x="34" y="66" fill="#E6EDE9" font-size="13">receives the bounty</text>
      <text x="20" y="94" fill="#8FA39A" font-size="12">paid by the contract</text>
    </g>
    <g fill="none" stroke="#2EE59D" stroke-width="1.6" marker-end="url(#arrow)">
      <path d="M270 106 H316"/>
      <path d="M610 106 H564"/>
      <path d="M270 342 H400 V252"/>
      <path d="M480 252 V342 H606"/>
    </g>
    <g fill="#8FA39A" font-size="11" text-anchor="middle">
      <text x="293" y="96">post</text>
      <text x="587" y="96">claim</text>
      <text x="335" y="334">release(signature)</text>
      <text x="543" y="334">transfer</text>
    </g>
  </g>
</svg>
