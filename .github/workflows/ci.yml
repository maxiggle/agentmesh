name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest --cov --cov-report=term-missing

  tpm:
    name: Test TPM keys (swtpm)
    runs-on: ubuntu-latest
    env:
      AGENTMESH_TPM_TEST: "1"
      TPM2TOOLS_TCTI: swtpm:host=127.0.0.1,port=2321
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y swtpm swtpm-tools tpm2-tools
      - name: Start a software TPM
        run: |
          mkdir -p "$RUNNER_TEMP/tpm"
          swtpm socket --tpm2 --daemon \
            --tpmstate dir="$RUNNER_TEMP/tpm" \
            --server type=tcp,port=2321 --ctrl type=tcp,port=2322 \
            --flags not-need-init,startup-clear
          tpm2_getcap properties-fixed > /dev/null
      - run: uv sync --locked
      - run: uv run pytest tests/identity/test_tpm.py -rs

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: [lint, test, tpm]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
