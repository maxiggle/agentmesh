name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest --cov --cov-report=term-missing

  tpm:
    name: Test TPM keys (swtpm)
    runs-on: ubuntu-latest
    env:
      EHOR_TPM_TEST: "1"
      TPM2TOOLS_TCTI: device:/dev/tpmrm0
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y swtpm swtpm-tools tpm2-tools
      - name: Start a software TPM behind the kernel resource manager
        run: |
          sudo modprobe tpm_vtpm_proxy
          mkdir -p "$RUNNER_TEMP/tpm"
          sudo swtpm chardev --vtpm-proxy --tpm2 --daemon \
            --tpmstate dir="$RUNNER_TEMP/tpm" --flags startup-clear
          for _ in 1 2 3 4 5; do [ -e /dev/tpmrm0 ] && break; sleep 1; done
          sudo chmod a+rw /dev/tpmrm0
          tpm2_getcap properties-fixed > /dev/null
      - run: uv sync --locked
      - run: uv run pytest tests/identity/test_tpm.py -rs

  contract-lint:
    name: Lint contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contract
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings

  contract-test:
    name: Test contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: contract
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contract
      - run: cargo test --locked

  contract-wasm:
    name: Build contract wasm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contract
      - run: rustup target add wasm32-unknown-unknown
      - name: Install cargo-near
        env:
          VERSION: 0.23.0
          SHA256: 94008b827a457750257eced4b571c33736062cc3bd1ffda3e7af70e2bc9a4073
          ASSET: cargo-near-x86_64-unknown-linux-gnu
        run: |
          curl -sSfL --retry 5 -o "$RUNNER_TEMP/$ASSET.tar.gz" \
            "https://github.com/near/cargo-near/releases/download/cargo-near-v$VERSION/$ASSET.tar.gz"
          echo "$SHA256  $RUNNER_TEMP/$ASSET.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$ASSET.tar.gz" -C "$RUNNER_TEMP"
          install "$RUNNER_TEMP/$ASSET/cargo-near" "$HOME/.cargo/bin/cargo-near"
      - run: cargo near build non-reproducible-wasm --locked
      - uses: actions/upload-artifact@v4
        with:
          name: contract-wasm
          path: contract/target/near/ehor_escrow.wasm

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: [lint, test, tpm, contract-lint, contract-test, contract-wasm]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv build --all-packages
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
