default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^src/ehor/escrow/web/near-connect\.js$
      - id: end-of-file-fixer
        exclude: ^src/ehor/escrow/web/near-connect\.js$
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
      - id: detect-private-key

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --manifest-path contract/Cargo.toml --check
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --manifest-path contract/Cargo.toml --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
      - id: conventional-commit
        name: conventional commit message
        entry: uv run python scripts/check_commit_msg.py --file
        language: system
        stages: [commit-msg]
